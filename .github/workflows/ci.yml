name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.service }} (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [worker, avatar]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alex
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: alex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alex" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql://alex:ci-password@localhost:5432/alex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../shared
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      # ESLint step added once frontend lint is set up (needs the TypeScript
      # ESLint parser; see context/LAUNCH_LOG.md Phase 0.4)

  images:
    name: image ${{ matrix.image }} (build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, file: avatar/Dockerfile, target: api }
          - { image: agent, file: avatar/Dockerfile, target: agent }
          - { image: worker, file: worker/Dockerfile, target: "" }
          - { image: frontend, file: frontend/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        if: matrix.image == 'api'
        run: docker compose config -q
      # Build only; pushing to a registry and deploying come with the CD
      # pipeline once hosting is chosen (docs/DEPLOY.md)
      - name: Build
        run: >-
          docker build -f ${{ matrix.file }}
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          -t alex-${{ matrix.image }}:ci .

  infra:
    name: infra (terraform + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -recursive -check -diff
      - name: Terraform validate
        run: |
          for dir in bootstrap envs/staging envs/production; do
            terraform -chdir=infra/terraform/$dir init -backend=false -input=false
            terraform -chdir=infra/terraform/$dir validate
          done
      - name: ShellCheck deploy scripts
        run: shellcheck deploy/deploy.sh scripts/aws/*.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        # Scans only the commits in this push/PR; known historical leak is
        # handled by key rotation (see context/LAUNCH_LOG.md)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose \
            --log-opts="${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}~1..{0}', github.sha) }}"

  dependency-audit:
    name: dependency audit (report only)
    runs-on: ubuntu-latest
    # Existing vulnerabilities are being triaged (LAUNCH_LOG Phase 0);
    # make this blocking once the baseline is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Each check runs even if an earlier one found something (if: always())
      - name: pip-audit worker
        working-directory: worker
        run: |
          uv export --locked --no-hashes --no-emit-project --no-emit-package alex-db -o /tmp/worker-req.txt
          uvx pip-audit -r /tmp/worker-req.txt --no-deps --disable-pip
      - name: pip-audit avatar
        if: always()
        working-directory: avatar
        run: |
          uv export --locked --no-hashes --no-emit-project --no-emit-package alex-db -o /tmp/avatar-req.txt
          uvx pip-audit -r /tmp/avatar-req.txt --no-deps --disable-pip
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "20"
      - name: npm audit (production dependencies)
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
