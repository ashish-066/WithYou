[project]
name = "alex-db"
version = "0.1.0"
description = "Shared Postgres models, sessions and migrations for the Alex services"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alex_db"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by Alembic autogenerate
extend-exclude = ["alex_db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
