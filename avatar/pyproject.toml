[project]
name = "presence-view-avatar"
version = "0.1.0"
description = "Voice agent + API for the Padippu Koottukaran study buddy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.0",
    # Redis
    "redis[hiredis]>=5.0",
    # LiveKit Agents Framework
    "livekit>=0.18",
    "livekit-agents[silero,turn-detector]>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-cartesia>=1.0.0",
    "livekit-plugins-bey>=0.1",
    "livekit-plugins-noise-cancellation>=0.2",
    # Async utilities
    "python-dotenv>=1.0",
    "alex-db",
    "livekit-plugins-sarvam==1.8.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "services", "api", "agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Long lines are mostly prompt/instruction strings; wrapping them is churn, not a fix
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# API keys must be copied into os.environ before the LiveKit plugins are imported
"agents/entrypoint.py" = ["E402"]

[tool.uv.sources]
alex-db = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.14",
]
