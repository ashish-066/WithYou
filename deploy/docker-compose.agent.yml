# The LiveKit agent, one compose project per release (alex-agent-<tag>), on
# the main stack's network. deploy.sh starts the new release's agent, then
# stops the old one in the background: it drains (finishes running
# interviews) for up to an hour while the new one takes new interviews.

services:
  agent:
    image: ${REGISTRY}/alex-agent:${IMAGE_TAG}
    env_file: [common.env, avatar.env]
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AGENT_DRAIN_TIMEOUT_SECONDS: "3600"
    stop_grace_period: 3630s
    networks: [alex]
    restart: always

networks:
  alex:
    name: alex_default
    external: true
