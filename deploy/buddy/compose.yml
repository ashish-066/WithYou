# Study buddy on one server: the full stack from ../../docker-compose.yml plus
# Caddy for HTTPS. Used by deploy/buddy/deploy.sh:
#   docker compose -f docker-compose.yml -f deploy/buddy/compose.yml up -d --build
# Settings in the root .env on the server: DOMAIN, ENVIRONMENT=production,
# REDIS_PASSWORD, POSTGRES_PASSWORD (generated by deploy.sh).
services:
  api:
    environment:
      # Caddy -> frontend nginx -> API
      TRUSTED_PROXY_HOPS: "2"
      CORS_ORIGINS: https://${DOMAIN}
      ALLOW_SIGNUP: "true"

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      DEMO_URL: ${DEMO_URL:-https://github.com/ashish-066/WithYou/blob/main/assets/withyou-demo.mp4}
    volumes:
      - ./deploy/buddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
